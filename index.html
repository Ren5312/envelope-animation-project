<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You 💌</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hearts">
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
    </div>

    <div class="container">

        <h1>💌 A Letter For You</h1>

        <p class="instruction">
            Click the envelope
        </p>

        <div class="envelope-wrapper" id="envelope">

            <div class="envelope">

                <!-- Letter -->
                <div class="letter">

                    <div class="letter-content">

                        <h2>Dear You, 💗</h2>

                        <p>
                            I made this little letter especially for you.
                        </p>

                        <p>
                            Sometimes, words are not enough to explain
                            how much someone means to us.
                        </p>

                        <p>
                            So here's a small surprise made with
                            HTML, CSS and JavaScript. 💕
                        </p>

                        <p class="signature">
                            From,<br>
                            Someone who cares 💖
                        </p>

                    </div>

                </div>

                <!-- Envelope body -->
                <div class="envelope-back"></div>

                <!-- Left flap -->
                <div class="flap left-flap"></div>

                <!-- Right flap -->
                <div class="flap right-flap"></div>

                <!-- Bottom flap -->
                <div class="flap bottom-flap"></div>

                <!-- Top flap -->
                <div class="flap top-flap"></div>

            </div>

        </div>

        <button id="openButton">
            Open Letter 💌
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
